{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpConnect - Sign Up</title>
    <link rel="stylesheet" href="{% static 'styles-signup.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>HelpConnect™</span>
        </div>
    </header>

    <main>
        <div class="welcome-card">
            <h1>Create Account</h1>
            <p class="subtitle">Join our community to help or receive help.</p>

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat your password" required>
                </div>

                <div class="selection-container">
                    <label class="option-card">
                        <input type="radio" name="user_type" value="need_help" style="display:none">
                        <i class="fa-regular fa-heart"></i>
                        <p>I need help</p>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="user_type" value="want_to_help" style="display:none">
                        <i class="fa-solid fa-handshake-angle"></i>
                        <p>I want to help</p>
                    </label>
                </div>

                <button type="submit" class="continue-btn">Create Account</button>
            </form>

            <p class="login-text">
                Already have an account? <a href="/login/">Log in</a>
            </p>
        </div>
    </main>

    <footer>
        HelpConnect™ 2026 - Assisting People with Disabilities
    </footer>

</body>
</html>
