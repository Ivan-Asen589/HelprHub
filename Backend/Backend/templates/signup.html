<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpConnect - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>HelpConnect</span>
        </div>
    </header>

    <main>
        <div class="welcome-card">
            <h1>Create Account</h1>
            <p class="subtitle">Join our community to help or receive help.</p>

            <div class="input-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password">
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat your password">
            </div>

            <div class="selection-container">
                <div class="option-card">
                    <i class="fa-regular fa-heart"></i>
                    <p>I need help</p>
                </div>
                <div class="option-card">
                    <i class="fa-solid fa-handshake-angle"></i>
                    <p>I want to help</p>
                </div>
            </div>

            <button class="continue-btn">Create Account</button>

            <p class="login-text">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </main>

    <footer>
        HelpConnect © 2026 - Assisting People with Disabilities
    </footer>

</body>
</html>
