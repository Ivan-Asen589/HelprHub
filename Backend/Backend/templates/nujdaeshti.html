<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpConnect - Need help</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
     <body>
    <header>
        <div class="header-content">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>HelpConnect™</span>
        </div>
    </header>
    <main>
        <div class="welcome card">
            <h1>Post a new request</h1>
               <p class="subtitle">What do you need help with?</p>
               <div class="input-group">
                <input type="text" id="name" placeholder="I need help with groceries, housework, mobility assitance ">
               </div>

               <p class="subtitle">On what dates do you need the help</p>
               <div class="input-group">
                <input type="text" id="name" placeholder="dd.mm.yy ">
               </div>

               <p class="subtitle">At what time do you need the help</p>
               <div class="input-group">
                <input type="text" id="name" placeholder="--:--">
               </div>

               <p class="subtitle">Location</p>
               <div class="input-group">
                <input type="text" id="name" placeholder="Sofia, J.K Durvenica, ul. Durvenica Blok 16, Vhod A">
               </div>

               <button>Post Request</button>

               <h3>Your Requests</h3>

        </div>
    </main>

    <footer>
        HelpConnect © 2026 - Assisting People with Disabilities
    </footer>
    
    </body>
</html>
